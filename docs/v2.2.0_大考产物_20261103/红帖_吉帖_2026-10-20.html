<!DOCTYPE html>

<style>
@page { size: A4 portrait; margin: 8mm; }
html, body { margin: 0; padding: 0; background: #C11B17; }
.paper {

  width: 190mm;
  box-sizing: border-box;
  min-height: 276mm;
  margin: 0 auto;
  padding: 10mm 6mm;
  text-align: center;
  border: 5px double #C9A227;  /* §205 S4：金色双线框（veto 深红纸型经替换继承） */
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.title { font-size: 38px; font-weight: bold; letter-spacing: 14px; }
.sub { font-size: 19px; letter-spacing: 4px; }
.diamond { font-size: 17px; letter-spacing: 10px; }
.h2 { font-size: 25px; font-weight: bold; letter-spacing: 8px; }
.body { font-size: 19px; line-height: 2.2; }
.small { font-size: 17px; line-height: 2.05; }
.sep { font-size: 16px; }
.warnhl { background: #FFFF00; color: #000000; }
.blank { font-size: 10px; }
/* §204 S1：排版升级 tag 样式（红纸版） */
.verdict { font-size: 57px; font-weight: bold; letter-spacing: 10px; line-height: 1.35; }
.stamp { display: inline-block; background: #FFD400; color: #140a00;
         font-size: 32px; font-weight: bold; letter-spacing: 8px;
         padding: 6mm 10mm; border: 1px solid #7a5a00; }
.tbl { font-size: 24px; line-height: 1.9; text-align: center;
       letter-spacing: 1px; padding: 2mm 0;
       border-bottom: 1px solid rgba(201,162,39,.55); }
.warn { font-size: 25px; line-height: 1.8; text-align: left;
        background: #FFF3B0; color: #4a1200;
        border-left: 6px solid #8B0000; padding: 2mm 3mm; margin: 1.5mm 0; }
/* §210 Commit 5：反推榜单慎用日强提示（加粗黄底黑框，置顶警示区） */
.hardwarn { font-size: 25px; font-weight: bold; line-height: 1.8; text-align: left;
            background: #FFFF00; color: #8B0000;
            border: 2px solid #8B0000; padding: 2.5mm 3mm; margin: 2mm 0; }
.rule { border-top: 3px double #C9A227; margin: 4mm auto; width: 96%; font-size: 1px; }
</style>
</head>
